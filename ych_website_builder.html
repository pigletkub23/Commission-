<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Commission Website Builder</title>
<style>
:root{--bg:#f5f3f0;--text:#262626;--accent:#d88ca2;--card:#fff;--line:#dedbd8;--radius:18px;--font:system-ui,sans-serif}
*{box-sizing:border-box}body{margin:0;background:#e9e7e5;color:#252525;font-family:system-ui,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}
.top{position:sticky;top:0;z-index:5;background:#252525;color:#fff;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px}.top strong{font-size:14px}.top button{border:0;border-radius:10px;padding:9px 12px;background:#fff;color:#222;font-weight:700}
.app{display:grid;grid-template-columns:minmax(280px,390px) 1fr;min-height:calc(100vh - 52px)}.panel{background:#fff;padding:14px;overflow:auto;max-height:calc(100vh - 52px);border-right:1px solid #ddd}.preview-wrap{padding:16px;overflow:auto}.tabs{display:flex;gap:6px;overflow:auto;margin-bottom:12px}.tab{border:1px solid #ddd;background:#f5f5f5;padding:8px 10px;border-radius:9px;white-space:nowrap}.tab.active{background:#252525;color:white}.section{border:1px solid #e3e3e3;border-radius:13px;padding:12px;margin:9px 0}.section h3{font-size:14px;margin:0 0 10px}.label{display:block;font-size:12px;color:#555;margin:9px 0 5px}.field,input,select,textarea{width:100%;border:1px solid #d6d6d6;border-radius:9px;padding:9px;background:#fff}.row{display:flex;gap:8px}.row>*{flex:1;min-width:0}.actions{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px}.actions button,.small{padding:7px 9px;border:1px solid #ddd;border-radius:8px;background:#f7f7f7;font-size:12px}.danger{color:#a31d35!important}.primary{background:#242424!important;color:#fff!important;border-color:#242424!important}.item{padding:9px;border:1px solid #ddd;border-radius:10px;margin:6px 0;display:flex;align-items:center;gap:8px}.item .name{flex:1;font-size:13px}.item button{padding:5px 7px}.preview{max-width:980px;margin:0 auto;background:var(--bg);color:var(--text);font-family:var(--font);border-radius:var(--radius);overflow:hidden;min-height:80vh;box-shadow:0 5px 22px #0001}.nav{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:15px 22px;border-bottom:1px solid var(--line);background:var(--card)}.brand{font-weight:800;font-size:18px;margin-right:auto}.nav a{color:inherit;text-decoration:none;font-size:13px;padding:5px}.page{padding:25px;min-height:50vh}.block{margin:0 0 22px}.block h1{font-size:clamp(26px,4vw,40px);margin:0 0 12px}.block h2{font-size:24px;margin:0 0 10px}.block p{line-height:1.7;white-space:pre-wrap}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}.ych-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}.ych-card img{width:100%;aspect-ratio:4/5;object-fit:cover;background:#eee;display:block}.ych-card .info{padding:12px}.ych-card h3{margin:0 0 5px;font-size:15px}.price{font-size:13px;opacity:.8}.site-button{display:inline-block;border:0;border-radius:var(--radius);background:var(--accent);color:#fff;padding:10px 15px;text-decoration:none;font-weight:700}.form-field{margin:10px 0}.form-field label{display:block;font-size:13px;margin-bottom:5px}.form-field input,.form-field textarea,.form-field select{border-radius:var(--radius)}.form-field input[type=checkbox]{width:auto}.footer{padding:16px;text-align:center;border-top:1px solid var(--line);font-size:12px;opacity:.7}
.anim-fade{animation:fade .7s ease both}.anim-float{animation:float 3s ease-in-out infinite}.anim-slide{animation:slide .65s ease both}.anim-zoom{animation:zoom .55s ease both}.anim-none{animation:none}@keyframes fade{from{opacity:0}to{opacity:1}}@keyframes float{50%{transform:translateY(-6px)}}@keyframes slide{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}@keyframes zoom{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
@media(max-width:800px){.app{grid-template-columns:1fr}.panel{max-height:none;border-right:0;border-bottom:1px solid #ddd}.preview-wrap{padding:8px}.preview{min-height:60vh}.page{padding:18px}.nav{padding:12px}.top{position:static}}
</style></head>
<body>
<div class="top"><strong>✦ Commission Website Builder</strong><div><button onclick="saveDraft()">Save draft</button> <button onclick="exportSite()">Export website</button></div></div>
<div class="app"><aside class="panel"><div class="tabs"><button class="tab active" onclick="setTab('structure',this)">Pages & blocks</button><button class="tab" onclick="setTab('content',this)">Content</button><button class="tab" onclick="setTab('style',this)">Design</button><button class="tab" onclick="setTab('forms',this)">Order form</button></div><div id="editor"></div></aside><main class="preview-wrap"><div id="preview" class="preview"></div></main></div>
<script>
const starter={brand:'YOUR ART NAME',theme:{bg:'#f7f4f2',text:'#292525',accent:'#d48ba2',card:'#ffffff',line:'#ded8d8',radius:18,font:'system-ui',animation:'fade'},pages:[{id:'home',name:'Home',blocks:[{type:'heading',text:'Commission',level:1},{type:'text',text:'Welcome! Please read the details and choose your YCH.'},{type:'gallery',title:'YCH Catalog',items:[{name:'YCH 01',price:150,status:'Available',image:''},{name:'YCH 02',price:200,status:'Available',image:''},{name:'YCH 03',price:250,status:'Taken',image:''}]},{type:'button',text:'Order here',action:'order'}]},{id:'tos',name:'TOS',blocks:[{type:'heading',text:'Terms of Service',level:1},{type:'text',text:'• Please provide clear references.\n• Payment and revisions can be discussed before I start.\n• Personal use unless otherwise agreed.'}]},{id:'order',name:'Order Form',blocks:[{type:'heading',text:'Order Form',level:1},{type:'form',fields:[{label:'Your name',kind:'text',required:true},{label:'Contact (Twitter / LINE)',kind:'text',required:true},{label:'Choose YCH',kind:'select',options:'YCH 01, YCH 02, YCH 03',required:true},{label:'Character reference / details',kind:'textarea',required:true},{label:'Add-ons',kind:'checkbox',options:'Extra character,Background,Commercial use'}]},{type:'button',text:'Copy order details',action:'copyorder'}]}]};let data=JSON.parse(JSON.stringify(starter));let tab='structure',activePage=0;
function setTab(t,btn){tab=t;document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));if(btn)btn.classList.add('active');renderEditor()}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function current(){return data.pages[activePage]}
function renderEditor(){const el=document.getElementById('editor');if(tab==='structure'){el.innerHTML=`<div class="section"><h3>Pages</h3>${data.pages.map((p,i)=>`<div class="item"><span class="name">${esc(p.name)}</span><button onclick="selectPage(${i})">Edit</button><button onclick="movePage(${i},-1)">↑</button><button onclick="movePage(${i},1)">↓</button><button class="danger" onclick="deletePage(${i})">×</button></div>`).join('')}<button class="primary" onclick="addPage()">＋ Add page</button></div><div class="section"><h3>Blocks in: ${esc(current().name)}</h3>${current().blocks.map((b,i)=>`<div class="item"><span class="name">${i+1}. ${esc(blockName(b.type))}${b.text?' — '+esc(b.text.slice(0,30)):''}</span><button onclick="editBlock(${i})">Edit</button><button onclick="moveBlock(${i},-1)">↑</button><button onclick="moveBlock(${i},1)">↓</button><button class="danger" onclick="removeBlock(${i})">×</button></div>`).join('')}<div class="actions">${['heading','text','image','gallery','button','form'].map(t=>`<button onclick="addBlock('${t}')">＋ ${blockName(t)}</button>`).join('')}</div></div>`}
else if(tab==='content'){el.innerHTML=`<div class="section"><h3>Page content</h3><label class="label">Page title</label><input value="${esc(current().name)}" oninput="current().name=this.value;renderPreview();renderEditor()"><label class="label">Site name</label><input value="${esc(data.brand)}" oninput="data.brand=this.value;renderPreview()"></div><div class="section"><h3>Edit block content</h3><p style="font-size:12px;color:#666">Choose a block in Pages & blocks and tap Edit to edit text, images, YCH cards, buttons, and form fields.</p></div>`}
else if(tab==='style'){el.innerHTML=`<div class="section"><h3>Colors</h3>${[['bg','Background'],['text','Text'],['accent','Accent / buttons'],['card','Cards'],['line','Borders']].map(([k,n])=>`<div class="row" style="align-items:center;margin:8px 0"><label class="label" style="margin:0;flex:1">${n}</label><input type="color" value="${data.theme[k]}" style="width:60px;height:38px;padding:3px" onchange="data.theme.${k}=this.value;renderPreview()"><input value="${data.theme[k]}" oninput="data.theme.${k}=this.value;renderPreview()"></div>`).join('')}</div><div class="section"><h3>Typography</h3><label class="label">Font</label><select onchange="data.theme.font=this.value;renderPreview()">${[['system-ui','System'],['Arial','Arial'],['Tahoma','Tahoma (Thai)'],['sans-serif','Sans-serif'],['serif','Serif'],['Georgia','Georgia'],['monospace','Monospace'],['Prompt','Prompt (Google Font)'],['Kanit','Kanit (Google Font)'],['Sarabun','Sarabun (Google Font)'],['Mitr','Mitr (Google Font)'],['Mali','Mali (Google Font)'],['Chakra Petch','Chakra Petch (Google Font)'],['IBM Plex Sans Thai','IBM Plex Sans Thai (Google Font)']].map(([v,n])=>`<option value="${v}" ${data.theme.font===v?'selected':''}>${n}</option>`).join('')}</select><label class="label">Rounded corners: ${data.theme.radius}px</label><input type="range" min="0" max="40" value="${data.theme.radius}" oninput="data.theme.radius=this.value;renderPreview()"></div><div class="section"><h3>Animation</h3><label class="label">Animation style</label><select onchange="data.theme.animation=this.value;renderPreview()">${[['none','None'],['fade','Fade'],['float','Float'],['slide','Slide in'],['zoom','Zoom']].map(([v,n])=>`<option value="${v}" ${data.theme.animation===v?'selected':''}>${n}</option>`).join('')}</select><p style="font-size:12px;color:#666">Animation applies to blocks in preview and exported page.</p></div>`}
else {let formBlock=current().blocks.find(b=>b.type==='form');el.innerHTML=`<div class="section"><h3>Order form builder</h3>${formBlock?formBlock.fields.map((f,i)=>`<div class="item"><span class="name">${esc(f.label)} (${esc(f.kind)})</span><button onclick="editField(${i})">Edit</button><button class="danger" onclick="deleteField(${i})">×</button></div>`).join(''):'No form on this page yet. Add a Form block under Pages & blocks.'}${formBlock?`<div class="actions">${['text','textarea','select','checkbox','color','file'].map(k=>`<button onclick="addField('${k}')">＋ ${k}</button>`).join('')}</div>`:''}</div>`}}
function blockName(t){return({heading:'Heading',text:'Text paragraph',image:'Image',gallery:'YCH gallery',button:'Button',form:'Order form'})[t]||t}
function selectPage(i){activePage=i;renderEditor();renderPreview()}function addPage(){let n=prompt('New page name?','New page');if(!n)return;data.pages.push({id:'page'+Date.now(),name:n,blocks:[{type:'heading',text:n,level:1},{type:'text',text:'Write something here.'}]});activePage=data.pages.length-1;renderEditor();renderPreview()}
function deletePage(i){if(data.pages.length<2)return alert('Keep at least one page.');if(confirm('Delete page?')){data.pages.splice(i,1);activePage=Math.min(activePage,data.pages.length-1);renderEditor();renderPreview()}}
function movePage(i,d){let j=i+d;if(j<0||j>=data.pages.length)return;[data.pages[i],data.pages[j]]=[data.pages[j],data.pages[i]];activePage=j;renderEditor();renderPreview()}
function addBlock(t){let b={type:t};if(t==='heading'){b.text='New heading';b.level=2}if(t==='text')b.text='Write text here.';if(t==='image'){b.image='';b.caption='Image caption'}if(t==='gallery'){b.title='YCH Catalog';b.items=[]}if(t==='button'){b.text='Click me';b.action='';b.url=''}if(t==='form')b.fields=[];current().blocks.push(b);renderEditor();renderPreview();editBlock(current().blocks.length-1)}
function removeBlock(i){current().blocks.splice(i,1);renderEditor();renderPreview()}function moveBlock(i,d){let j=i+d;if(j<0||j>=current().blocks.length)return;[current().blocks[i],current().blocks[j]]=[current().blocks[j],current().blocks[i]];renderEditor();renderPreview()}
function editBlock(i){let b=current().blocks[i];let html='';if(['heading','text'].includes(b.type)){html=`<label class="label">Text</label><textarea id="btext" rows="4">${esc(b.text)}</textarea>${b.type==='heading'?`<label class="label">Heading level</label><select id="blevel"><option value="1" ${b.level==1?'selected':''}>H1</option><option value="2" ${b.level==2?'selected':''}>H2</option><option value="3" ${b.level==3?'selected':''}>H3</option></select>`:''}`}
if(b.type==='image'){html=`<label class="label">Upload image</label><input type="file" accept="image/*" id="bimg"><label class="label">Caption</label><input id="bcaption" value="${esc(b.caption||'')}">`}
if(b.type==='gallery'){html=`<label class="label">Gallery title</label><input id="btitle" value="${esc(b.title||'YCH Catalog')}"><div id="galleryItems">${b.items.map((it,j)=>`<div class="section"><strong>${esc(it.name||'YCH')}</strong><label class="label">Name</label><input id="gn${j}" value="${esc(it.name)}"><label class="label">Price</label><input id="gp${j}" type="number" value="${esc(it.price)}"><label class="label">Status</label><select id="gs${j}"><option ${it.status==='Available'?'selected':''}>Available</option><option ${it.status==='Taken'?'selected':''}>Taken</option><option ${it.status==='On hold'?'selected':''}>On hold</option></select><label class="label">Image</label><input type="file" accept="image/*" id="gi${j}"></div>`).join('')}</div><button onclick="addGalleryItem(${i})">＋ Add YCH</button>`}
if(b.type==='button'){html=`<label class="label">Button label</label><input id="btext" value="${esc(b.text)}"><label class="label">Action</label><select id="baction"><option value="order" ${b.action==='order'?'selected':''}>Go to order form</option><option value="copyorder" ${b.action==='copyorder'?'selected':''}>Copy order summary</option><option value="url" ${b.action==='url'?'selected':''}>Open URL</option><option value="none" ${b.action==='none'?'selected':''}>No action</option></select><label class="label">URL (if Open URL)</label><input id="burl" value="${esc(b.url||'')}">`}
if(b.type==='form'){html=`<p>Manage fields from the Order form tab.</p>`}
let dlg=document.createElement('dialog');dlg.style.cssText='border:0;border-radius:14px;width:min(92vw,500px);padding:20px';dlg.innerHTML=`<h3>Edit ${blockName(b.type)}</h3>${html}<div class="actions"><button onclick="this.closest('dialog').close();this.closest('dialog').remove()">Cancel</button><button class="primary" id="saveBlock">Save</button></div>`;document.body.append(dlg);dlg.showModal();dlg.querySelector('#saveBlock').onclick=async()=>{if(['heading','text'].includes(b.type)){b.text=dlg.querySelector('#btext').value;if(b.type==='heading')b.level=dlg.querySelector('#blevel').value}if(b.type==='image'){let file=dlg.querySelector('#bimg').files[0];if(file)b.image=await fileData(file);b.caption=dlg.querySelector('#bcaption').value}if(b.type==='gallery'){b.title=dlg.querySelector('#btitle').value;for(let j=0;j<b.items.length;j++){b.items[j].name=dlg.querySelector('#gn'+j).value;b.items[j].price=dlg.querySelector('#gp'+j).value;b.items[j].status=dlg.querySelector('#gs'+j).value;let f=dlg.querySelector('#gi'+j).files[0];if(f)b.items[j].image=await fileData(f)}}if(b.type==='button'){b.text=dlg.querySelector('#btext').value;b.action=dlg.querySelector('#baction').value;b.url=dlg.querySelector('#burl').value}dlg.close();dlg.remove();renderEditor();renderPreview()}}
function addGalleryItem(i){current().blocks[i].items.push({name:'YCH '+String(current().blocks[i].items.length+1).padStart(2,'0'),price:100,status:'Available',image:''});editBlock(i)}
function fileData(f){return new Promise((res,rej)=>{let r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)})}
function addField(k){let fb=current().blocks.find(b=>b.type==='form');if(!fb)return;fb.fields.push({label:'New field',kind:k,required:false,options:''});renderEditor();renderPreview()}
function editField(i){let f=current().blocks.find(b=>b.type==='form').fields[i];let d=document.createElement('dialog');d.style.cssText='border:0;border-radius:14px;width:min(92vw,500px);padding:20px';d.innerHTML=`<h3>Edit form field</h3><label class="label">Label</label><input id="fl" value="${esc(f.label)}"><label class="label">Type</label><select id="fk">${['text','textarea','select','checkbox','color','file'].map(k=>`<option ${f.kind===k?'selected':''}>${k}</option>`).join('')}</select><label class="label">Options (for dropdown / checkbox, comma separated)</label><input id="fo" value="${esc(f.options||'')}"><label><input id="fr" type="checkbox" ${f.required?'checked':''}> Required</label><div class="actions"><button onclick="this.closest('dialog').close();this.closest('dialog').remove()">Cancel</button><button class="primary" id="fs">Save</button></div>`;document.body.append(d);d.showModal();d.querySelector('#fs').onclick=()=>{f.label=d.querySelector('#fl').value;f.kind=d.querySelector('#fk').value;f.options=d.querySelector('#fo').value;f.required=d.querySelector('#fr').checked;d.close();d.remove();renderEditor();renderPreview()}}
function deleteField(i){current().blocks.find(b=>b.type==='form').fields.splice(i,1);renderEditor();renderPreview()}
function renderPreview(){let p=document.getElementById('preview');p.style.setProperty('--bg',data.theme.bg);p.style.setProperty('--text',data.theme.text);p.style.setProperty('--accent',data.theme.accent);p.style.setProperty('--card',data.theme.card);p.style.setProperty('--line',data.theme.line);p.style.setProperty('--radius',data.theme.radius+'px');p.style.setProperty('--font',data.theme.font.includes(' ')&&['Prompt','Kanit','Sarabun','Mitr','Chakra Petch','IBM Plex Sans Thai'].includes(data.theme.font)?`'${data.theme.font}',sans-serif`:data.theme.font);
let nav=`<div class="nav"><div class="brand">${esc(data.brand)}</div>${data.pages.map((pg,i)=>`<a href="#pg${i}" onclick="event.preventDefault();activePage=${i};renderEditor();renderPreview();">${esc(pg.name)}</a>`).join('')}</div>`;let pages=data.pages.map((pg,i)=>`<div class="page" id="pg${i}" style="${i===activePage?'':'display:none'}">${pg.blocks.map(b=>renderBlock(b)).join('')}</div>`).join('');p.innerHTML=nav+pages+`<div class="footer">Preview · Customize this site in the editor</div>`;p.querySelectorAll('.block').forEach(x=>x.classList.add('anim-'+data.theme.animation));}
function renderBlock(b){if(b.type==='heading')return `<div class="block"><h${b.level||2}>${esc(b.text)}</h${b.level||2}></div>`;if(b.type==='text')return `<div class="block"><p>${esc(b.text)}</p></div>`;if(b.type==='image')return `<div class="block">${b.image?`<img src="${b.image}" style="max-width:100%;border-radius:var(--radius)"></img>`:'<div style="padding:35px;background:#eee;text-align:center;border-radius:var(--radius)">Upload image in editor</div>'}<p>${esc(b.caption||'')}</p></div>`;if(b.type==='gallery')return `<div class="block"><h2>${esc(b.title||'YCH Catalog')}</h2><div class="cards">${b.items.map((it,i)=>`<div class="ych-card"><img src="${it.image||''}" alt="${esc(it.name)}" onerror="this.style.opacity=.1"><div class="info"><h3>${esc(it.name)}</h3><div class="price">${it.price?`฿${esc(it.price)}`:''} · ${esc(it.status)}</div></div></div>`).join('')}</div></div>`;if(b.type==='button')return `<div class="block"><button class="site-button" onclick="previewAction('${esc(b.action)}','${esc(b.url||'')}')">${esc(b.text)}</button></div>`;if(b.type==='form')return `<div class="block"><form onsubmit="return previewSubmit(event)">${b.fields.map((f,i)=>fieldHtml(f,i)).join('')}<button class="site-button" type="submit">Submit / Copy</button></form></div>`;return ''}
function fieldHtml(f,i){let req=f.required?'required':'';let opts=(f.options||'').split(',').map(x=>x.trim()).filter(Boolean);if(f.kind==='textarea')return `<div class="form-field"><label>${esc(f.label)}</label><textarea data-label="${esc(f.label)}" ${req} rows="3"></textarea></div>`;if(f.kind==='select')return `<div class="form-field"><label>${esc(f.label)}</label><select data-label="${esc(f.label)}" ${req}><option value="">Select…</option>${opts.map(x=>`<option>${esc(x)}</option>`).join('')}</select></div>`;if(f.kind==='checkbox')return `<div class="form-field"><label>${esc(f.label)}</label>${opts.map(x=>`<label><input type="checkbox" data-label="${esc(f.label)}" value="${esc(x)}"> ${esc(x)}</label>`).join('')}</div>`;if(f.kind==='file')return `<div class="form-field"><label>${esc(f.label)}</label><input type="file" data-label="${esc(f.label)}" ${req}></div>`;if(f.kind==='color')return `<div class="form-field"><label>${esc(f.label)}</label><input type="color" data-label="${esc(f.label)}" ${req}></div>`;return `<div class="form-field"><label>${esc(f.label)}</label><input type="text" data-label="${esc(f.label)}" ${req}></div>`}
function previewAction(a,url){if(a==='url'&&url)window.open(url,'_blank');if(a==='order'){activePage=data.pages.findIndex(pg=>pg.blocks.some(b=>b.type==='form'));if(activePage<0)activePage=0;renderPreview();renderEditor()}if(a==='copyorder')alert('Fill in the form and press Submit to copy order details.')}
function previewSubmit(e){e.preventDefault();let f=e.target,summary=[];f.querySelectorAll('[data-label]').forEach(x=>{if(x.type==='checkbox'){if(x.checked)summary.push(x.dataset.label+': '+x.value)}else if(x.value)summary.push(x.dataset.label+': '+(x.type==='file'?x.files[0]?.name:x.value))});let txt=summary.join('\n');if(navigator.clipboard?.writeText)navigator.clipboard.writeText(txt).then(()=>alert('Order details copied! Paste into DM.')).catch(()=>alert(txt));else alert(txt);return false}
function saveDraft(){localStorage.setItem('ychWebsiteDraft',JSON.stringify(data));alert('Draft saved on this device/browser.')}

Boolean),req=f.required?'required':'';if(f.kind==='textarea')return '<div class="form-field"><label>'+esc(f.label)+'</label><textarea data-label="'+esc(f.label)+'" '+req+'></textarea></div>';if(f.kind==='select')return '<div class="form-field"><label>'+esc(f.label)+'</label><select data-label="'+esc(f.label)+'" '+req+'><option></option>'+opts.map(x=>'<option>'+esc(x)+'</option>').join('')+'</select></div>';if(f.kind==='checkbox')return '<div class="form-field"><label>'+esc(f.label)+'</label>'+opts.map(x=>'<label><input type="checkbox" data-label="'+esc(f.label)+'" value="'+esc(x)+'"> '+esc(x)+'</label>').join('');if(f.kind==='file')return '<div class="form-field"><label>'+esc(f.label)+'</label><input type="file" data-label="'+esc(f.label)+'" '+req+'></div>';return '<div class="form-field"><label>'+esc(f.label)+'</label><input type="'+(f.kind==='color'?'color':'text')+'" data-label="'+esc(f.label)+'" '+req+'></div>'}function block(b){if(b.type==='heading')return '<div class="block"><h'+(b.level||2)+'>'+esc(b.text)+'</h'+(b.level||2)+'></div>';if(b.type==='text')return '<div class="block"><p style="white-space:pre-wrap;line-height:1.7">'+esc(b.text)+'</p></div>';if(b.type==='image')return '<div class="block"><img style="max-width:100%;border-radius:'+d.theme.radius+'px" src="'+(b.image||'')+'"><p>'+esc(b.caption||'')+'</p></div>';if(b.type==='gallery')return '<div class="block"><h2>'+esc(b.title||'YCH Catalog')+'</h2><div class="cards">'+b.items.map(x=>'<div class="ych-card"><img src="'+(x.image||'')+'"><div class="info"><b>'+esc(x.name)+'</b><p>฿'+esc(x.price)+' · '+esc(x.status)+'</p></div></div>').join('')+'</div>';if(b.type==='button')return '<div class="block"><button class="site-button" onclick="'+(b.action==='url'?'window.open(\''+esc(b.url)+'\')':b.action==='order'?'document.querySelector(\'.page[data-form]\')?.scrollIntoView()':'')+'">'+esc(b.text)+'</button></div>';if(b.type==='form')return '<div class="block"><form onsubmit="return submitOrder(event)">'+b.fields.map(fld).join('')+'<button class="site-button">Submit / Copy</button></form></div>';return ''}function submitOrder(e){e.preventDefault();let a=[];e.target.querySelectorAll('[data-label]').forEach(x=>{if(x.type==='checkbox'){if(x.checked)a.push(x.dataset.label+': '+x.value)}else if(x.value)a.push(x.dataset.label+': '+(x.type==='file'?x.files[0]?.name:x.value))});let t=a.join('\\n');navigator.clipboard?.writeText(t).then(()=>alert('Copied order! Paste in DM.')).catch(()=>alert(t));return false}document.getElementById('site').innerHTML='<div class="nav"><div class="brand">'+esc(d.brand)+'</div>'+d.pages.map((p,i)=>'<a href="#page'+i+'" onclick="document.querySelectorAll(\'.page\').forEach(x=>x.style.display=\'none\');document.getElementById(\'page'+i+'\').style.display=\'block\';return false">'+esc(p.name)+'</a>').join('')+'</div>'+d.pages.map((p,i)=>'<div class="page" id="page'+i+'" '+(p.blocks.some(b=>b.type==='form')?'data-form':'')+' style="'+(i?'display:none':'')+'">'+p.blocks.map(block).join('')+'</div>').join('');<\\/script></body></html>`;let blob=new Blob([exported],{type:'text/html'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='commission-website.html';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
